<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="tf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c49f"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon: Luxury Diamond Perfume Bottle with spray mist -->
  <g transform="translate(10, 8)">
    <!-- Outer diamond shield with glow -->
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#18181f" stroke="url(#tf-grad)" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Bottle Cap (Gold geometric) -->
    <rect x="26" y="14" width="12" height="7" rx="1.5" fill="url(#gold-grad)"/>
    <rect x="29" y="11" width="6" height="3" rx="1" fill="#fef08a"/>
    
    <!-- Bottle Body (Crystal facet cuts) -->
    <path d="M22,23 L42,23 L46,47 L32,53 L18,47 Z" fill="rgba(0, 196, 159, 0.15)" stroke="url(#tf-grad)" stroke-width="1.8"/>
    
    <!-- Inner faceted liquid essence -->
    <polygon points="32,27 40,36 32,48 24,36" fill="url(#tf-grad)" opacity="0.85"/>
    <circle cx="32" cy="37" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <!-- Top decorative micro text -->
  <text x="82" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="4" fill="#00c49f" text-transform="uppercase">
    HAUTE PARFUMERIE
  </text>

  <!-- Main Wordmark: The Fragance´s -->
  <text x="80" y="50" font-family="'Cinzel', 'Playfair Display', Georgia, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#ffffff">
    The Fragance´s
  </text>

  <!-- Bottom slogan -->
  <text x="82" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.5" fill="#9ca3af" text-transform="uppercase">
    CATÁLOGO EXCLUSIVO &amp; DECISIÓN OLFATIVA
  </text>
</svg>
