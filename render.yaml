services:
  - type: web
    name: thefragances-perfumes
    env: python
    buildCommand: python -m pip install -r requirements.txt && python seed.py
    startCommand: python -m gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
